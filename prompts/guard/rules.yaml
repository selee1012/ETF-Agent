# 컴플라이언스 가드 ① 룰 (P1-AG-06)
# - banned: 답변 본문(고지 문구 제외)에 나오면 차단하는 표현. pattern은 Python 정규식.
#   부정형(예: "원금이 보장되지 않습니다")은 부정 전방탐색으로 걸러낸다.
# - numbers: 근거 없는 수치 검사. 단위가 붙은 수치·소수만 검사한다.
version: 1

banned:
  - id: guarantee_principal
    reason: 원금 보장·보전 표현
    pattern: '원금\s*(?:이|을|은|의)?\s*(?:100\s*%\s*)?(?:보장|보전|지켜)(?!\s*(?:되지|하지|되는\s*것은?\s*아니|받지|되진|하진|않|안|대상이\s*아니))'
  - id: guarantee_return
    reason: 수익·이익 보장 또는 확정 표현
    pattern: '(?:수익|이익|수익률|이자)\s*(?:이|을|은)?\s*(?:보장|확정|약속)(?!\s*(?:되지|하지|되는\s*것은?\s*아니|않|안))'
  - id: no_loss
    reason: 손실이 없다는 단정
    pattern: '(?:손실|손해)\s*(?:이|가|은|는)?\s*(?:전혀\s*)?(?:없(?:습니다|어요|다|는|음)|날\s*일이\s*없|볼\s*일이\s*없)'
  - id: certain_gain
    reason: 확실한 수익 단정
    pattern: '(?:무조건|반드시|확실(?:히|하게)?|100\s*%)\s*(?:오르|오릅|올라|오를|상승|수익|이익|벌|돈을\s*벌)'
  - id: definitive_forecast
    reason: 단정적 가격 전망
    pattern: '(?:오를|상승할|하락할|내릴|떨어질|급등할|폭등할)\s*(?:것입니다|겁니다|거예요|것이다|게\s*확실|수밖에)'
  - id: solicitation
    reason: 매수·매도 권유
    pattern: '(?:지금|당장|오늘)?\s*(?:매수|매도|투자|구매)\s*(?:를|를\s*적극)?\s*(?:추천|권유|권장)\s*(?:합니다|드립니다|해요|드려요)|(?:사세요|파세요|매수하세요|매도하세요|담으세요|투자하세요)'
  - id: risk_free
    reason: 무위험 단정
    pattern: '(?:무위험|위험\s*(?:이|은)?\s*(?:전혀\s*)?없는\s*(?:상품|투자|ETF))'

numbers:
  enabled: true
  # 이 단위가 붙은 수치와 소수점 수치만 근거와 대조한다.
  pattern: '(?<![\d.])(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?\s*(%|원|배|bp|억|조|만|주|좌)?'
  require_unit_or_decimal: true
  # 근거와 무관하게 허용하는 수치(일반 상식·서비스 문구)
  allow: ["15.4%", "2배", "-1배", "1배", "0%", "100%"]

pii:
  enabled: true
