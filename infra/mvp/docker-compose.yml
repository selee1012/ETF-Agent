# MVP 런타임: 서버 한 대에서 `api` + `cloudflared`를 띄운다. DB를 같은 서버에 둘 때는 `--profile dev`로 postgres를 추가한다.
# Makefile 타깃은 없다(make up/down은 infra/local용). 루트에서 직접 실행한다:
#   docker compose -f infra/mvp/docker-compose.yml --env-file .env [--profile dev] up -d
#   docker compose -f infra/mvp/docker-compose.yml --env-file .env [--profile dev] down
name: etf-agent

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: etf-agent-api:local
    env_file:
      - path: ../../.env
        required: true
    environment:
      # 업로드 원본 저장 위치. 이미지에서 app 사용자가 쓸 수 있는 경로는 /data/storage뿐이다
      # (기본값 /workspace/var/storage는 root 소유라 업로드가 PermissionError로 실패한다).
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      # 컨테이너를 다시 만들어도 업로드 원본이 남도록 볼륨에 둔다.
      - storage:/data/storage
    ports:
      # 외부 노출은 cloudflared가 담당하므로 호스트 루프백에만 바인딩한다.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    # 종료·재시작 때 진행 중인 답변의 저장(스트림 대기 20초 + 저장 대기 15초)이 끝날 시간을 준다.
    stop_grace_period: 45s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      # Zero Trust 대시보드에서 발급한 원격 관리 터널 토큰. ingress는 대시보드에서 http://api:8000 으로 설정
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---------- dev 프로필 ----------
  postgres:
    profiles: ["dev"]
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  storage:
